# Supabase CLI configuration for local development (`supabase start`).
# Hosted projects are configured in the Dashboard; keep the auth settings below in step there.
project_id = "ksr-self-drive-cars"

[api]
schemas = ["public"]

[db]
major_version = 15

[auth]
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080/admin/reset-password"]
jwt_expiry = 3600
# ADM-02: no public sign-up. Staff accounts are created by the Owner (admin-staff invites).
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

# ADM-03: two-step verification with an authenticator app.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# ADM-05: sessions end after 12 hours.
[auth.sessions]
timebox = "12h"

# ADM-06 / AUD-01: login lockout and login audit (migration 20261011000600_auth_hooks.sql).
[auth.hook.password_verification_attempt]
enabled = true
uri = "pg-functions://postgres/public/hook_password_verification_attempt"

[storage]
file_size_limit = "10MiB"

# Publishable keys are not JWTs, so the gateway must not verify them. Functions that need a
# signed-in user validate the token themselves (requireUser); cron functions check x-cron-secret.
[functions.submit-booking]
verify_jwt = false

[functions.document-upload]
verify_jwt = false

[functions.document-view-url]
verify_jwt = false

[functions.create-upload-link]
verify_jwt = false

[functions.customer-upload]
verify_jwt = false

[functions.notify]
verify_jwt = false

[functions.retention-purge]
verify_jwt = false

[functions.admin-staff]
verify_jwt = false
