<!doctype html>
<!-- Shown by the Android app when the site can't be reached (capacitor.config.ts → server.errorPath). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No connection · KSR Self Drive Cars</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1d2125;
        --page: #e9ebe7;
        --muted: #555c63;
        --action: #0a6640;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--page);
        color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }
      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: var(--ink);
        color: #ffc72c;
        font-weight: 800;
        font-size: 20px;
        letter-spacing: 0.5px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 26px;
        line-height: 1.2;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      button {
        width: 100%;
        min-height: 52px;
        border: 0;
        border-radius: 12px;
        background: var(--action);
        color: #fff;
        font: inherit;
        font-weight: 700;
      }
      button:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">KSR</span>
      <h1>No connection</h1>
      <p>We can't reach KSR Self Drive Cars right now. Check your mobile data or Wi-Fi, then try again.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      // Going back retries the page that failed to load.
      function retry() {
        if (history.length > 1) history.back();
        else location.reload();
      }
      document.getElementById('retry').addEventListener('click', retry);
      window.addEventListener('online', retry);
    </script>
  </body>
</html>
